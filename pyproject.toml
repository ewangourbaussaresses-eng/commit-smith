[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-smith"
version = "1.0.0"
description = "Génère des messages de commit conventionnels depuis git diff et des README professionnels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "commit-smith contributors" }]
keywords = ["git", "commit", "conventional-commits", "readme", "cli", "llm"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
commit-smith = "commit_smith.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["commit_smith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
